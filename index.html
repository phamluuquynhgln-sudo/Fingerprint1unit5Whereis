<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Where Is the Puppet</title>
<style>
:root{--bg:#fff8e6;--ink:#2b2340;--card:#fff;--on:#f28c28;--in:#2fa84f;--under:#2f7fd8;--pri:#e8505b;--soft:#ffe9b8;--navy:#111c37;--gold:#f5cf6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;overflow-x:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#top{position:sticky;top:0;z-index:20}
#brand{background:var(--navy);color:var(--gold);text-align:center;font-size:11px;letter-spacing:2px;padding:4px 0;font-weight:700;text-transform:uppercase}
#bar{display:flex;align-items:center;gap:8px;background:#fff;padding:6px 10px;box-shadow:0 2px 6px #0001}
#bar .t{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:46px;height:46px;border:0;border-radius:14px;background:var(--soft);font-size:22px;cursor:pointer}
#score{font-weight:800;background:#fff3c4;border-radius:12px;padding:8px 10px;font-size:16px}
main{max-width:720px;margin:0 auto;padding:12px 12px 16px}
.foot{text-align:center;font-size:11px;color:#8a7f9a;padding:5px;background:#fff8e6e6}
h1{text-align:center;margin:8px 0 2px;font-size:30px;color:var(--pri)}
.sub{text-align:center;color:#6b6280;margin-bottom:6px}
.cbadge{display:block;width:max-content;margin:6px auto 12px;background:var(--navy);color:var(--gold);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800;letter-spacing:1.5px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv{background:#fff;border-radius:20px;padding:12px;border:3px solid #ffe0a0;cursor:pointer;text-align:center;box-shadow:0 3px 0 #f2cf86;position:relative}
.lv .em{font-size:38px}.lv b{display:block;font-size:16px;margin-top:4px}.lv small{color:#7a7090}
.lv.done{border-color:#7bd38c;box-shadow:0 3px 0 #5bb86c}.lv .ck{position:absolute;top:6px;right:10px;font-size:18px}
.prog{display:flex;gap:6px;justify-content:center;margin:4px 0 10px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:50%;background:#e8dcc0;display:inline-block}.prog i.y{background:#7bd38c}.prog i.c{background:var(--pri)}
.scene{width:100%;max-width:560px;display:block;margin:0 auto;border-radius:18px;background:#fff;box-shadow:0 3px 10px #0002}
.big{font-size:22px;font-weight:800;text-align:center;margin:10px 0}
.say{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{min-height:52px;padding:10px 18px;border:0;border-radius:16px;font-size:19px;font-weight:800;cursor:pointer;color:#fff;background:var(--pri);box-shadow:0 4px 0 #0003;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0003}
.btn.g{background:#2fa84f}.btn.y{background:#f0a500}.btn.b{background:#6c63c7}.btn.w{background:#fff;color:var(--ink);border:3px solid #eee}
.preps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:12px auto 0}
.pb{border:0;border-radius:18px;color:#fff;font-size:24px;font-weight:900;padding:8px 4px;cursor:pointer;box-shadow:0 4px 0 #0003;font-family:inherit;min-height:84px}
.pb svg{display:block;margin:0 auto;width:60px;height:44px}
.pb.on{background:var(--on)}.pb.in{background:var(--in)}.pb.under{background:var(--under)}
.pb.dim{opacity:.35}
.tag{display:inline-block;border-radius:10px;padding:0 8px;color:#fff}.tag.on{background:var(--on)}.tag.in{background:var(--in)}.tag.under{background:var(--under)}
.ch3{display:grid;grid-template-columns:1fr;gap:10px;max-width:560px;margin:10px auto}
@media(min-width:620px){.ch3{grid-template-columns:repeat(3,1fr);max-width:720px}}
.ch{border:4px solid #fff;border-radius:18px;cursor:pointer;background:#fff;padding:0;box-shadow:0 3px 8px #0002;overflow:hidden}
.ch{display:flex;justify-content:center}.ch svg{display:block;width:100%;max-height:22vh}@media(min-width:620px){.ch svg{max-height:none}}
.ch.ok{border-color:#2fa84f}.ch.bad{border-color:#e8505b}
.eggs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:440px;margin:0 auto}
.egg{background:#fff;border-radius:20px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 8px #0002;flex-direction:column}
.egg svg{width:80%;height:80%}.egg b{font-size:20px}
.shake{animation:sh .4s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .5s}@keyframes pp{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.wob{animation:wb .35s}@keyframes wb{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}70%{transform:rotate(9deg)}}
.hit{cursor:pointer}
.glow{animation:gl 1s infinite}@keyframes gl{50%{opacity:.35}}
.res{background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 4px 14px #0002;max-width:420px;margin:20px auto}
.res .st{font-size:44px}.res .cn{color:var(--navy);font-weight:800;letter-spacing:1.5px;font-size:12px;margin-top:10px}
#gate{position:fixed;inset:0;z-index:99;background:linear-gradient(#fff3c4,#ffd27a);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;cursor:pointer;padding:20px}
#gate .b{font-size:80px;animation:gl 1.2s infinite}#gate h2{margin:10px 0 4px;font-size:28px}
#gate .ios{display:none;margin-top:14px;background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;max-width:320px}
.conf{position:fixed;top:-20px;font-size:26px;z-index:50;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.teach{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0}
.teach .f{font-size:46px}.bub{background:#fff;border-radius:18px;padding:10px 14px;font-size:21px;font-weight:800;box-shadow:0 2px 8px #0002;position:relative}
.bub.talk{outline:4px solid #ffd27a}
.it{transform-box:fill-box;transform-origin:50% 100%}
</style>
</head>

<div id="top"><div id="brand"></div><div id="bar"><button class="ib" id="home" aria-label="home">🏠</button><div class="t" id="ttl">Where is the puppet?</div><span id="score">⭐ 0</span></div></div>
<main id="app"></main>

function scene2(pl,opt){
 opt=opt||{};const items=Object.entries(pl);const boxClosed=items.some(([k,s])=>s==="on_box");
 const g=([k,s])=>itemSVG(k,s,opt.hit?"hit":"",opt.hit?`data-hit="${k}"`:"");
 const inBox=items.filter(([k,s])=>s==="in_box").map(g).join("");
 const rest=items.filter(([k,s])=>s!=="in_box"&&s!=="in_cup");
 const under=rest.filter(([k,s])=>s.startsWith("under")).map(g).join("");
 const others=rest.filter(([k,s])=>!s.startsWith("under")).map(([k,s])=>k==="cup"?inCupFirst(pl,g,[k,s]):g([k,s])).join("");
 return `<svg viewBox="0 0 400 260" class="scene ${opt.cls||""}" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="200" fill="#fdf6b8"/><rect x="230" y="40" width="70" height="56" rx="4" fill="#bfe6ff" stroke="#fff" stroke-width="5"/><rect y="200" width="400" height="60" fill="#3fb6e8"/><path d="M40 254 l130 -24 l46 10 l-130 24 Z" fill="#ffe08a" opacity=".85"/>${bed()}${table()}${under}${inBox}${(()=>{const ib=items.find(([k,s])=>s==="in_box");return opt.hit&&ib?`<g class="hit" data-hit="${ib[0]}">${box(boxClosed)}</g>`:box(boxClosed)})()}${others}</svg>`}
function inCupFirst(pl,g,c){// feather in cup: draw feather relative to cup position
 const f=pl.feather==="in_cup";if(!f)return g(c);const p=SPOT[c[1]];
 return `<g transform="translate(${p[0]} ${p[1]-14}) scale(${.75*p[2]})" data-hit="feather" data-k="feather"><g class="it"><circle cx="0" cy="-44" r="22" fill="transparent"/>${ART.feather}</g></g>`+g(c)}
function draw(pl,opt){return scene2(pl,opt)}
function prepOf(s){return s.split("_")[0]}
function prepIcon(p){const c={on:"var(--on)",in:"var(--in)",under:"var(--under)"}[p];
 const bx=`<rect x="14" y="16" width="32" height="18" fill="#fff" opacity=".9"/><rect x="16" y="34" width="4" height="8" fill="#fff"/><rect x="40" y="34" width="4" height="8" fill="#fff"/>`;
 const ball=p==="on"?`<circle cx="30" cy="9" r="7" fill="#ffe14d" stroke="#333"/>`:p==="in"?`<circle cx="30" cy="20" r="7" fill="#ffe14d" stroke="#333"/>`:`<circle cx="30" cy="38" r="5" fill="#ffe14d" stroke="#333"/>`;
 return `<svg viewBox="0 0 60 44">${p==="in"?ball+bx.replace('opacity=".9"','opacity=".75"'):bx+ball}</svg>`}
/* ================= STATE ================= */
const S={lv:-1,score:0,done:[0,0,0,0,0,0],best:[0,0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem("qec_puppet")||"null");if(s){S.done=s.done||S.done;S.best=s.best||S.best}}catch(e){}
function save(){try{localStorage.setItem("qec_puppet",JSON.stringify({done:S.done,best:S.best}))}catch(e){}}
const $=s=>document.querySelector(s),app=$("#app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function setScore(){$("#score").textContent="⭐ "+S.score}
function prog(n,i){return `<div class="prog">${Array.from({length:n},(_,k)=>`<i class="${k<i?"y":k===i?"c":""}"></i>`).join("")}</div>`}
function confetti(){const e=["⭐","🎉","🎈","✨","🧸","🪶"];for(let i=0;i<22;i++){const d=document.createElement("div");d.className="conf";d.textContent=e[i%e.length];d.style.left=Math.random()*100+"vw";d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function popEl(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function award(first){const p=first?10:5;S.score+=p;S.lvScore+=p;setScore()}
/* ================= MENU ================= */
function menu(){stopAudio();S.lv=-1;$("#ttl").textContent="Where is the puppet?";
 const tot=S.best.reduce((a,b)=>a+b,0);
 app.innerHTML=`<h1>Where is the puppet?</h1><div class="sub">feather · cup · teddy bear · puppet · on · in · under</div><span class="cbadge">👑 ${CENTER}</span>
 <div style="margin:0 auto 12px;max-width:520px">${draw({feather:"in_cup",cup:"on_table",teddy:"on_bed",puppet:"in_box"})}</div>
 <div class="menu">${LEVELS.map((l,i)=>`<div class="lv ${S.done[i]?"done":""}" data-l="${i}">${S.done[i]?'<span class="ck">✅</span>':""}<div class="em">${l.em}</div><b>${i+1}. ${l.tt}</b><small>${l.ss}${S.best[i]?" · ⭐"+S.best[i]:""}</small></div>`).join("")}</div>
 <p style="text-align:center;color:#7a7090">⭐ ${tot}</p>`;
 app.querySelectorAll(".lv").forEach(d=>d.onclick=()=>start(+d.dataset.l))}
function start(l){S.lv=l;S.lvScore=0;S.i=0;$("#ttl").textContent=(l+1)+". "+LEVELS[l].tt;window.scrollTo(0,0);[q1,q2,q3,q4,q5,q6][l]()}
function finish(){stopAudio();const l=S.lv;S.done[l]=1;S.best[l]=Math.max(S.best[l],S.lvScore);save();sfx("fx_win");confetti();setTimeout(()=>say("well"),700);
 const max=[40,80,80,30,80,60][l],r=S.lvScore/max,st=r>=.85?"⭐⭐⭐":r>=.6?"⭐⭐":"⭐";
 app.innerHTML=`<div class="res"><div class="st">${st}</div><h2 style="margin:6px 0">${LEVELS[l].em} ${LEVELS[l].tt}</h2><div class="big">⭐ ${S.lvScore} / ${max}</div>
 <div class="say"><button class="btn w" id="rp">🔁</button>${l<5?`<button class="btn g" id="nx">Next ▶</button>`:""}<button class="btn b" id="mn">🏠</button></div><div class="cn">👑 ${CENTER}</div></div>`;
 $("#rp").onclick=()=>start(l);$("#mn").onclick=menu;if($("#nx"))$("#nx").onclick=()=>start((l+1)%6)}
/* ================= LEVEL 1: Egg Surprise ================= */
function eggSVG(c){const cr=["","M30 40 l8 6 l-6 6","M30 40 l8 6 l-6 6 l10 8 M58 30 l-6 10 l8 6","M30 40 l8 6 l-6 6 l10 8 l-8 10 M58 30 l-6 10 l8 6 l-10 10 l8 8"][c];
 return `<svg viewBox="0 0 90 100"><ellipse cx="45" cy="55" rx="32" ry="40" fill="${["#ffd1dc","#c9f0d6","#cfe3ff","#fff1b3"][S.ec%4]}" stroke="#b08a5a" stroke-width="3"/><circle cx="35" cy="40" r="4" fill="#fff8"/><circle cx="55" cy="70" r="5" fill="#fff8"/><path d="${cr}" fill="none" stroke="#6b4a2a" stroke-width="3"/></svg>`}
function q1(){const n=WORDS.length;let opened=0;const taps=Array(n).fill(0);
 app.innerHTML=`<div class="big">Tap tap tap! 🥚</div><div class="eggs">${WORDS.map((w,i)=>`<div class="egg" data-i="${i}"></div>`).join("")}</div>`;
 app.querySelectorAll(".egg").forEach((e,i)=>{S.ec=i;e.innerHTML=eggSVG(0);
  e.onclick=()=>{if(taps[i]>=3){say("w_"+WORDS[i].k);popEl(e);return}taps[i]++;S.ec=i;
   if(taps[i]<3){e.innerHTML=eggSVG(taps[i]);e.classList.remove("wob");void e.offsetWidth;e.classList.add("wob");sfx("fx_ok")}
   else{e.innerHTML=`<svg viewBox="-45 -75 90 85">${ART[WORDS[i].k]}</svg><b>${WORDS[i].w}</b>`;popEl(e);sfx("fx_ok");setTimeout(()=>say("w_"+WORDS[i].k),300);award(true);opened++;if(opened===n)setTimeout(finish,2200)}}})}
/* ================= LEVEL 2: Where is the…? (find in room) ================= */
function q2(){const R=shuffle(WORDS.map(w=>w.k)).concat(shuffle(WORDS.map(w=>w.k)));let i=0,tries=0,busy=false;
 function show(){if(i>=R.length)return finish();tries=0;busy=false;const k=R[i];window.__ans=k;
  app.innerHTML=prog(R.length,i)+`<div class="teach"><span class="f">👩‍🏫</span><div class="bub talk" id="bb">Where is the …? 🔊</div></div><div id="sc">${draw(HOME,{hit:1})}</div><div class="say"><button class="btn w" id="rp">🔊 Again</button></div>`;
  const ask=()=>say("q_"+k);setTimeout(ask,300);$("#rp").onclick=ask;$("#bb").onclick=ask;
  app.querySelectorAll("[data-hit]").forEach(g=>g.onclick=ev=>{ev.stopPropagation();if(busy)return;const h=g.dataset.hit;
   if(h===k){busy=true;sfx("fx_ok");award(tries===0);popEl(g.querySelector(".it")||g);$("#bb").innerHTML=`Where is the ${WORDS.find(w=>w.k===k).w}?<br><span class="tag ${prepOf(HOME[k])}">It's ${SPOT_TXT[HOME[k]]}.</span>`;setTimeout(()=>say("a_"+HOME[k],()=>{i++;setTimeout(show,400)}),450)}
   else{tries++;sfx("fx_no");shake(g.querySelector(".it")||g);setTimeout(()=>say("w_"+h,()=>setTimeout(ask,200)),420)}})}
 show()}
/* ================= LEVEL 3: Ask & Answer with teacher ================= */
function q3(){const C=[];WORDS.forEach(w=>{C.push({k:w.k,a:"q_"+w.k,s:"qs_"+w.k,t:"Where is the "+w.w+"?",who:"🙋"});C.push({k:w.k,a:"a_"+HOME[w.k],s:"as_"+HOME[w.k],t:"It's "+SPOT_TXT[HOME[w.k]]+".",who:"👩‍🏫",p:prepOf(HOME[w.k])})});let i=0,tries=0;
 function show(){if(i>=C.length)return finish();const c=C[i];tries=0;const only={};only[c.k]=HOME[c.k];if(c.k==="feather")only.cup="on_table";
  app.innerHTML=prog(C.length,i)+`<div id="sc">${draw(only)}</div><div class="teach"><span class="f">${c.who}</span><div class="bub" id="bb">${c.p?c.t.replace(c.p,`<span class="tag ${c.p}">${c.p}</span>`):c.t}</div></div><div class="big" style="font-size:17px;color:#7a7090">👂 Listen… then say! 🗣️</div>
  <div class="say"><button class="btn g" id="ok">✅ I said it</button><button class="btn y" id="ag">🔁 Again</button><button class="btn b" id="sl">🐢 Slowly</button></div>`;
  const play=k=>{$("#bb").classList.add("talk");say(k,()=>$("#bb")&&$("#bb").classList.remove("talk"))};setTimeout(()=>play(c.a),300);
  $("#ag").onclick=()=>{tries++;play(c.a)};$("#sl").onclick=()=>{tries++;play(c.s)};$("#bb").onclick=()=>play(c.a);
  $("#ok").onclick=()=>{sfx("fx_ok");award(true);popEl($("#bb"));i++;setTimeout(show,700)}}
 show()}
/* ================= LEVEL 4: On · In · Under (move the puppet) ================= */
function q4(){const seen=new Set();let busy=false;const M={on:"on_box",in:"in_box",under:"under_box"};let cur="in_box";
 function paint(){$("#sc").innerHTML=draw({puppet:cur});const g=$("#sc [data-k=puppet] .it");if(g)popEl(g)}
 app.innerHTML=`<div class="big">Where is the puppet? 🐊</div><div id="sc"></div><div class="preps">${["on","in","under"].map(p=>`<button class="pb ${p}" data-p="${p}">${prepIcon(p)}${p}</button>`).join("")}</div><div class="teach"><div class="bub" id="bb">👆</div></div>`;
 cur="on_bed";paint();setTimeout(()=>say("q_puppet"),300);
 app.querySelectorAll(".pb").forEach(b=>b.onclick=()=>{if(busy)return;busy=true;const p=b.dataset.p;cur=M[p];paint();sfx("fx_ok");
  $("#bb").innerHTML=`<span class="tag ${p}">${p}</span> — It's <b>${p}</b> the box.`;
  seq(["p_"+p,"a_"+M[p]],()=>{busy=false;if(!seen.has(p)){seen.add(p);award(true);b.style.outline="4px solid #fff";b.insertAdjacentHTML("beforeend"," ✓")}if(seen.size===3)setTimeout(finish,600)},300)})}
/* ================= LEVEL 5: On, In or Under? ================= */
function q5(){const R=shuffle(L5);let i=0,tries=0,busy=false;
 function show(){if(i>=R.length)return finish();const [k,s]=R[i];tries=0;busy=false;window.__ans=prepOf(s);const pl={};pl[k]=s;if(s==="in_cup")pl.cup="on_table";
  app.innerHTML=prog(R.length,i)+`<div id="sc">${draw(pl)}</div><div class="teach"><span class="f">👩‍🏫</span><div class="bub talk" id="bb">Where is the ${WORDS.find(w=>w.k===k).w}? 🔊</div></div><div class="preps">${["on","in","under"].map(p=>`<button class="pb ${p}" data-p="${p}">${prepIcon(p)}${p}</button>`).join("")}</div>`;
  const ask=()=>say("q_"+k);setTimeout(ask,300);$("#bb").onclick=ask;
  app.querySelectorAll(".pb").forEach(b=>b.onclick=()=>{if(busy)return;const p=b.dataset.p;
   if(p===prepOf(s)){busy=true;sfx("fx_ok");award(tries===0);popEl(b);app.querySelectorAll(".pb").forEach(x=>{if(x!==b)x.classList.add("dim")});$("#bb").innerHTML=`It's <span class="tag ${p}">${p}</span> ${SPOT_TXT[s].split(" ").slice(1).join(" ")}.`;setTimeout(()=>say("a_"+s,()=>{i++;setTimeout(show,400)}),400)}
   else{tries++;sfx("fx_no");shake(b);setTimeout(()=>say("again"),400)}})}
 show()}
/* ================= LEVEL 6: Find the Picture ================= */
function q6(){const R=shuffle(L6);let i=0,tries=0,busy=false;
 function show(){if(i>=R.length)return finish();const r=R[i],k=r[0],ans=r[1];tries=0;busy=false;const opts=shuffle(r.slice(1));window.__ans=ans;
  app.innerHTML=prog(R.length,i)+`<div class="teach"><span class="f">👂</span><div class="bub talk" id="bb">🔊 Listen!</div></div><div class="ch3">${opts.map(s=>{const pl={};pl[k]=s;if(s==="in_cup")pl.cup="on_table";return `<button class="ch" data-s="${s}">${draw(pl)}</button>`}).join("")}</div>`;
  const ask=()=>seq(["q_"+k,"a_"+ans]);setTimeout(ask,300);$("#bb").onclick=ask;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>{if(busy)return;
   if(b.dataset.s===ans){busy=true;b.classList.add("ok");sfx("fx_ok");award(tries===0);popEl(b);$("#bb").innerHTML=`It's <span class="tag ${prepOf(ans)}">${prepOf(ans)}</span> ${SPOT_TXT[ans].split(" ").slice(1).join(" ")}.`;setTimeout(()=>say("good",()=>{i++;setTimeout(show,300)}),500)}
   else{tries++;b.classList.add("bad");sfx("fx_no");shake(b);setTimeout(()=>{b.classList.remove("bad");ask()},700)}})}
 show()}
/* ================= BOOT ================= */
$("#brand").textContent="👑 "+CENTER;$("#foot").textContent="👑 "+CENTER+" · "+UNIT;
$("#home").onclick=()=>{stopAudio();menu()};
if(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))$("#ios").style.display="block";
$("#gate").onclick=()=>{unlock();$("#gate").remove();setTimeout(()=>say("w_puppet"),150)};
menu();
</script>
</body>
